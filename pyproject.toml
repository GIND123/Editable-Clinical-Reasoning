[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinblueprint"
version = "0.1.0"
description = "Causally editable clinical reasoning: language models whose diagnoses follow valid clinician corrections and resist invalid ones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Causally Editable Clinical Reasoning authors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Core = everything needed for the graph schema, checks, hard readout, edits,
# validator rules, metrics, benchmark construction and the test-suite (CPU only).
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "rapidfuzz>=3.5",
  "scikit-learn>=1.3",
  "tqdm>=4.65",
]

[project.optional-dependencies]
# GPU training / inference (one 48 GB card). Freeze exact versions with
# `uv pip compile` on the GPU host once the environment is known to work.
train = [
  "torch>=2.3",
  "transformers>=4.51",   # Qwen3 + Gemma-3/MedGemma support
  "peft>=0.13",
  "accelerate>=0.34",
  "bitsandbytes>=0.43",
  "datasets>=2.20",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
]
rl = ["trl>=0.12"]
constrained = ["lm-format-enforcer>=0.10"]
serve = ["vllm>=0.6"]          # optional local batched inference (Linux + CUDA)
mech = [
  "circuit-tracer",            # attribution graphs (transcoders for Qwen3-4B / Gemma)
  "sae-lens>=4.0",             # SAEs incl. Gemma Scope 2
]
nlp = ["scispacy>=0.5"]        # optional concept normalisation (UMLS linker needs licence)
study = ["statsmodels>=0.14", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
clinblueprint = "clinblueprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
