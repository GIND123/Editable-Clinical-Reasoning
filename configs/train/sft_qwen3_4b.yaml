defaults:
  - ../model/qwen3_4b.yaml
seed: 0
output_dir: outputs/sft/qwen3_4b_fold0
kg_dir: data/raw/direct_kg
fold_file: data/processed/direct.folds.json
exclude_folds: [0, 1]        # test fold 0, dev fold 1 (see data/splits.fold_split)
train_files:
  - data/processed/direct.graphs.jsonl
  - data/silver/medcasereasoning_train.silver.jsonl
  - data/silver/mimic_note.silver.jsonl
n_distractor_categories: 2
verbalizer_fraction: 0.5
lora: {r: 16, alpha: 32, dropout: 0.05}
train:
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  epochs: 2
  warmup_ratio: 0.03
  scheduler: cosine
  save_steps: 500
  report_to: none
